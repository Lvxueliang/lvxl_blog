# Simple workflow for deploying static content to GitHub Pages
name: Deploy lvxl_blog

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，peaceiris 需要用其推送 lvxl-pages 分支
permissions:
  contents: write

# 同一时间只允许一个部署，排队中的旧 run 不取消，避免并发强推 lvxl-pages 互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: check-branch
        uses: actions/checkout@v4
      - name: set-Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.2.0
          registry-url: https://registry.npmjs.org/ # 如果不配置将影响publish
      - name: npm i
        run: npm install pnpm@10 -g
      - name: pnpm i
        run: pnpm i
      - name: build
        run: pnpm run build
      - name: Deploy to Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN  }}
          publish_dir: ./build
          publish_branch: lvxl-pages